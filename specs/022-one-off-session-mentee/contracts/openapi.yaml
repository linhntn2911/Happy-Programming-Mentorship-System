openapi: 3.0.3
info:
  title: Public Mentor Offerings
  version: 1.0.0
paths:
  /api/mentors/{identifier}/offerings:
    get:
      summary: List active offerings for a public mentor
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Active monthly and one-off offerings in the standard API envelope
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Offering'
components:
  schemas:
    Offering:
      type: object
      required: [id, name, serviceType, description, price, currency, sessionDurationMinutes, status]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        serviceType: { type: string, enum: [MONTHLY, ONE_OFF] }
        planTier: { type: string, nullable: true }
        description: { type: string }
        price: { type: number }
        currency: { type: string }
        sessionDurationMinutes: { type: integer }
        callsPerPeriod: { type: integer, nullable: true }
        trialDays: { type: integer }
        responseTimeHours: { type: integer, nullable: true }
        chatIncluded: { type: boolean }
        status: { type: string, enum: [ACTIVE] }
