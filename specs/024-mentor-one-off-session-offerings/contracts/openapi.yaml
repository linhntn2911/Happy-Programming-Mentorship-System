openapi: 3.0.3
info:
  title: HappyProgramming Mentor One-Off Sessions
  version: 1.0.0
paths:
  /api/mentors/me/one-off-sessions:
    get:
      summary: List the signed-in mentor's one-off sessions
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: One-off session offerings }
    put:
      summary: Create or update the signed-in mentor's one-off sessions
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessions]
              properties:
                sessions:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [name, description, price, sessionDurationMinutes]
                    properties:
                      id: { type: integer, format: int64, nullable: true }
                      name: { type: string, maxLength: 200 }
                      description: { type: string, maxLength: 4000 }
                      price: { type: number, minimum: 0 }
                      sessionDurationMinutes: { type: integer, minimum: 10, maximum: 1440 }
                      status: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        '200': { description: Saved one-off session offerings }
        '400': { description: Invalid offering data }
        '401': { description: Authentication required }
        '403': { description: Active mentor role required }
