spring.application.name=happyprogramming-backend
server.port=${PORT:8080}
server.servlet.context-path=/
server.error.include-message=always
server.error.include-stacktrace=never
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Database Configuration (Microsoft SQL Server)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=HappyProgramming;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Local demonstration identity only; never enable on deployed environments.
hpms.mentor.demo.enabled=${MENTOR_DEMO_ENABLED:false}
hpms.mentor.demo.user-id=${MENTOR_DEMO_USER_ID:}
