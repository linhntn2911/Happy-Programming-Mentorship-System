spring.application.name=happyprogramming-backend
server.port=${PORT:8080}
server.servlet.context-path=/
server.error.include-message=always
server.error.include-stacktrace=never
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Database connection. Production settings must be supplied through environment variables.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=HappyProgramming;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Local demonstration identity is opt-in and must never be enabled on deployed environments.
hpms.mentor.demo.enabled=${MENTOR_DEMO_ENABLED:false}
hpms.mentor.demo.user-id=${MENTOR_DEMO_USER_ID:}

# Session cookies are HttpOnly and SameSite=Lax. Enable secure cookies behind production HTTPS.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Google OAuth is disabled unless explicitly enabled and both credentials are configured.
hpms.google.enabled=${GOOGLE_LOGIN_ENABLED:false}
hpms.google.client-id=${GOOGLE_CLIENT_ID:}
hpms.google.client-secret=${GOOGLE_CLIENT_SECRET:}
hpms.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
hpms.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# SMTP credentials are optional; verification email is unavailable until configured.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
hpms.mail.from-name=${MAIL_FROM_NAME:HappyProgramming}